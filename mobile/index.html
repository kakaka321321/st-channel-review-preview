<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Storyteller｜スマホ版プレビュー</title><style>*{box-sizing:border-box}body{margin:0;background:#f4efe9;color:#302921;font:16px/1.7 system-ui,sans-serif}form{margin:14vh auto 0;background:white;border-top:6px solid #df5620;border-radius:5px;padding:28px;width:min(90%,400px)}h1{font-size:23px;line-height:1.45}input,button{width:100%;font:inherit;padding:11px;border:1px solid #aaa;border-radius:4px}button{background:#aa390e;color:white;border:0;margin-top:15px;cursor:pointer}iframe{border:0;background:white;transform-origin:top left;display:block}iframe[hidden]{display:none}</style><form><h1>スマホ版 LPプレビュー</h1><label>共有パスワード<input required type="password" autocomplete="current-password"></label><button>プレビューを開く</button><p role="status"></p></form><iframe hidden title="スマホ版のLP"></iframe><script>const q=x=>document.querySelector(x),f=q("form"),box=q("iframe"),dec=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));function resize(){const w=Math.min(390,innerWidth),a=innerWidth,r=Math.min(1,a/w);box.style.width=w+"px";box.style.height=(innerHeight/r)+"px";box.style.marginLeft=Math.max(0,(a-w)/2)+"px";box.style.transform="scale("+r+")"}f.onsubmit=async e=>{e.preventDefault();const btn=q("button"),msg=q("[role=status]");btn.disabled=true;try{const r=await fetch("../artwork-v3.bin");if(!r.ok)throw Error("fetch");const b=await r.arrayBuffer();const initial=await crypto.subtle.importKey("raw",new TextEncoder().encode(q("input").value),"PBKDF2",false,["deriveKey"]);const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:dec("QB2stYdK8/VljDIB6faSmg=="),iterations:600000,hash:"SHA-256"},initial,{name:"AES-GCM",length:256},false,["decrypt"]);const text=await crypto.subtle.decrypt({name:"AES-GCM",iv:dec("XPm/IZaOg+roRmP2")},k,b);f.reset();f.hidden=true;document.body.style.overflow="hidden";resize();box.srcdoc=new TextDecoder().decode(text);box.hidden=false}catch(err){msg.textContent=err.name==="OperationError"?"パスワードをご確認ください。":"読み込みに失敗しました。再度お試しください。"}finally{btn.disabled=false}};addEventListener("resize",resize)</script></html>
